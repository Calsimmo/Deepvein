name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: deepvein-mod
          path: build/libs/*.jar
      - name: Smoke test (start a dedicated server with the mod)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          timeout 480 gradle runServer --no-daemon > server.log 2>&1 || true
          echo "---- deepvein / error lines ----"
          grep -n -i "deepvein\|exception\|couldn't\|could not\|failed\|Done (" server.log | head -200 || true
          grep -q "Done (" server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: server.log
